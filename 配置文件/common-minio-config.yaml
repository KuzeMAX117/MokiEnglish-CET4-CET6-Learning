minio:
  # MinIO服务器地址 - 虚拟机内用localhost，宿主机访问需改成 192.168.68.132
  endpoint: http://localhost:9000
  # MinIO服务器访问凭据 - 默认 minioadmin/minioadmin，虚拟机请设环境变量
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  # MinIO桶名称
  bucket: topic
  # MinIO读取路径前缀
  readPath: http://localhost:9000
