server:
  port: 9993
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
            maxAge: 36000
      routes:
        - id: topic-security
          uri: lb://topic-security
          predicates:
            - Path=/api/security/**
          filters:
            - StripPrefix=1
        - id: service-system
          uri: lb://service-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        - id: service-topic
          uri: lb://service-topic
          predicates:
            - Path=/api/topic/**
          filters:
            - StripPrefix=1
        - id: service-ai
          uri: lb://service-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
               
security:
  # captcha:
  #   enabled: true
  #   type: math
  # xss:
  #   enabled: true
  #   excludeUrls:
  #     - /system/notice
  ignore:
    whites:
      - /api/security/user/loginType
      - /api/security/user/logout
      - /api/security/user/sendEmail
      - /api/security/user/resetPassword
      - /api/security/user/register
